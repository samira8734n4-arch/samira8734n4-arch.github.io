name: Deploy to GitHub Pages

# The site lives in src/. docs/ is design documentation and must not be
# published, which is why this uploads src/ explicitly rather than using the
# built-in /docs publishing source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./src
      - id: deployment
        uses: actions/deploy-pages@v4
